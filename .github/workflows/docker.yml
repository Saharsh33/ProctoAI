name: Docker Build and Push

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'fastapi-backend/**'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./fastapi-backend
          dockerfile: ./fastapi-backend/Dockerfile
          push: false
          tags: proctoai/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in Docker
        run: |
          docker compose -f docker-compose.yml build backend
          docker compose -f docker-compose.yml run --rm backend pytest

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fastapi-backend/requirements.txt
          pip install flake8 black isort

      - name: Lint with flake8
        run: |
          flake8 fastapi-backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 fastapi-backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with black
        run: black --check fastapi-backend/app

      - name: Check import sorting with isort
        run: isort --check-only --profile black fastapi-backend/app
