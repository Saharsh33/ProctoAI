version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: proctoai_postgres_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizapp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proctoai_network_dev

  # FastAPI Backend (Development with auto-reload)
  backend:
    build:
      context: ./fastapi-backend
      dockerfile: Dockerfile.dev
    container_name: proctoai_backend_dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-quizapp}
      
      # FastAPI
      APP_NAME: ProctoAI Backend (Dev)
      DEBUG: ${DEBUG:-true}
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
      
      # JWT
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      
      # MinIO
      MINIO_URL: ${MINIO_URL:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-proctoai}
      
      # PDF Reports
      PDF_REPORT_DIR: ${PDF_REPORT_DIR:-/app/reports}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./fastapi-backend:/app
      - reports_volume_dev:/app/reports
    networks:
      - proctoai_network_dev

  # MinIO (Development)
  minio:
    image: minio/minio:latest
    container_name: proctoai_minio_dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data_dev:/minio_data
    command: server /minio_data --console-address ":9001"
    networks:
      - proctoai_network_dev

volumes:
  postgres_data_dev:
    driver: local
  minio_data_dev:
    driver: local
  reports_volume_dev:
    driver: local

networks:
  proctoai_network_dev:
    driver: bridge
